            </a>
          </li>

          <!-- Contact -->
          <li

    <!-- ================= SIGNUP SECTION ================= -->

    <main
      class="min-h-[calc(100vh-80px)] bg-cover bg-center bg-no-repeat px-4 pb-32"
      style="
        background-image:
          linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.856),
            rgba(11, 1, 1, 0.796)
          ),
          url(&quot;../images/warrior.jpg&quot;);
      "
    >
      <section class="mx-auto w-full max-w-[1300px] pt-8">
        <!-- Flip Card -->
        <div
          id="card"
          class="flip-card relative mx-auto h-[650px] w-full max-w-[380px]"
        >
          <!-- ================= LOGIN ================= -->

          <div
            class="card-face absolute left-0 top-0 h-full w-full rounded-[10px] text-center"
          >
            <p
              class="mx-auto mt-8 w-[60px] border-b-2 border-[#ff8177] pb-1 font-bold text-[#ff8177]"
            >
              LOG IN
            </p>

            <!-- Login Image -->
            <img
              src="../images/download.jpg"
              alt="Login"
              class="mx-auto mt-5 mb-8 h-[200px] w-[240px] rounded-[50px] object-cover opacity-60"
              style="clip-path: circle(38% at 50% 49%)"
            />

            <form
              method="post"
              action=""
              id="loginForm"
              class="flex flex-col items-center"
            >
              <!-- Username -->
              <div
                class="error w-full max-w-[300px] text-center"
                id="loginUsernameError"
              ></div>

              <input
                type="text"
                name="username"
                placeholder="Username"
                maxlength="10"
                autocomplete="off"
                onkeyup="validateLoginUsername()"
                class="w-[280px] rounded-[4px] border-0 bg-[#f0f5f9] px-[25px] py-[13px] text-center text-[15px] text-black outline-none max-[480px]:w-[260px]"
              />

              <!-- Password -->
              <div
                class="error mt-2 w-full max-w-[300px] text-left"
                id="loginPasswordError"
              ></div>

              <input
                type="password"
                name="password"
                placeholder="Password"
                maxlength="10"
                autocomplete="off"
                onkeyup="validateLoginPassword()"
                class="w-[280px] rounded-[4px] border-0 bg-[#f0f5f9] px-[25px] py-[13px] text-center text-[15px] text-black outline-none max-[480px]:w-[260px]"
              />

              <button
                type="submit"
                name="login"
                value="clicked"
                onclick="return validateLoginForm();"
                class="mt-7 rounded-[4px] border-0 bg-[#ff8177] px-[60px] py-3 text-white transition duration-300 hover:bg-[#4837ff]"
              >
                Log in
              </button>

              <span
                onclick="flip()"
                class="mt-8 cursor-pointer text-[#ff8177] hover:text-[#ffb199]"
              >
                Create an account
              </span>
            </form>
          </div>

          <!-- ================= SIGN UP ================= -->

          <div
            class="card-face card-back absolute left-0 top-0 h-full w-full rounded-[10px] text-center"
          >
            <p
              class="mx-auto mt-12 w-[70px] border-b-2 border-[#ff8177] pb-1 font-bold text-[#ff8177]"
            >
              SIGN UP
            </p>

            <form
              method="post"
              action=""
              id="signUp"
              class="mt-5 flex flex-col items-center"
            >
              <!-- First Name -->
              <div
                class="error w-full max-w-[300px] text-center"
                id="firstNameError"
              ></div>

              <input
                type="text"
                name="first_name"
                placeholder="First name"
                maxlength="10"
                autocomplete="off"
                onkeyup="validateFirstName()"
                class="w-[280px] rounded-[4px] border-0 bg-[#f0f5f9] px-[25px] py-[13px] text-center text-[15px] text-black outline-none max-[480px]:w-[260px]"
              />

              <!-- Last Name -->
              <div
                class="error mt-1 w-full max-w-[300px] text-center"
                id="lastNameError"
              ></div>

              <input
                type="text"
                name="last_name"
                placeholder="Last name"
                maxlength="10"
                autocomplete="off"
                onkeyup="validateLastName()"
                class="w-[280px] rounded-[4px] border-0 bg-[#f0f5f9] px-[25px] py-[13px] text-center text-[15px] text-black outline-none max-[480px]:w-[260px]"
              />

              <!-- Username -->
              <div
                class="error mt-1 w-full max-w-[300px] text-center"
                id="usernameError"
              ></div>

              <input
                type="text"
                name="username"
                placeholder="Username"
                maxlength="10"
                autocomplete="off"
                onkeyup="validateUsername()"
                class="w-[280px] rounded-[4px] border-0 bg-[#f0f5f9] px-[25px] py-[13px] text-center text-[15px] text-black outline-none max-[480px]:w-[260px]"
              />

              <!-- Email -->
              <div
                class="error mt-1 w-full max-w-[300px] text-center"
                id="emailError"
              ></div>

              <input
                type="email"
                name="email"
                placeholder="E-mail"
                maxlength="30"
                autocomplete="off"
                onkeyup="validateEmail()"
                class="w-[280px] rounded-[4px] border-0 bg-[#f0f5f9] px-[25px] py-[13px] text-center text-[15px] text-black outline-none max-[480px]:w-[260px]"
              />

              <!-- Password -->
              <div
                class="error mt-1 w-full max-w-[300px] text-center"
                id="passwordError"
              ></div>

              <input
                type="password"
                name="password"
                placeholder="Password"
                maxlength="10"
                autocomplete="off"
                onkeyup="validatePassword()"
                class="w-[280px] rounded-[4px] border-0 bg-[#f0f5f9] px-[25px] py-[13px] text-center text-[15px] text-black outline-none max-[480px]:w-[260px]"
              />

              <button
                type="submit"
                name="signup"
                value="clicked"
                onclick="return validateForm();"
                class="mt-6 rounded-[4px] border-0 bg-[#ff8177] px-[60px] py-3 text-white transition duration-300 hover:bg-[#4837ff]"
              >
                Sign up
              </button>

              <span
                onclick="flip()"
                class="mt-6 cursor-pointer text-[#ff8177] hover:text-[#ffb199]"
              >
                Log in
              </span>
            </form>
          </div>
        </div>
      </section>
    </main>

          <!-- Social -->

            </a>

        </div>

        <!-- Footer Bottom -->
        <div
          class="mx-auto mt-10 flex w-[90%] max-w-[767px] items-center justify-between max-[820px]:flex-col max-[820px]:gap-8"
        >
          <!-- Logo -->
          <a

            id="footer__logo"
            class="flex items-center text-[2rem] text-white no-underline"
          >
            <i class="fab fa-google">

          </a>

          <!-- Copyright -->
          <p class="text-white max-[820px]:mb-8">
            &copy; 2026. All rights reserved

          <!-- Social Icons -->
          <div class="flex w-[240px] items-center justify-evenly">
            <a

            <a

        </div>

    <!-- ================= JAVASCRIPT ================= -->

    <script>
      /* =========================================================
     MOBILE MENU
  ========================================================= */

      const menu = document.querySelector("#mobile-menu");
      const menuLinks = document.querySelector("#nav-act");

      /*
      Mobile menu
    */
      menu.addEventListener("click", function () {
        menu.classList.toggle("is-active");
        menuLinks.classList.toggle("mobile-menu-open");
      });

      /*
      Active navigation link
    */
      function setActiveLink() {
        const links = document.querySelectorAll("#nav-act li");

        links.forEach((link) => {
          link.classList.remove(
            "border-t",
            "border-b",
            "border-[#4837ff]",
            "border-b-[#f77062]",
            "rounded-full",
          );

          const anchor = link.querySelector("a");

          if (!anchor) return;

          const href = anchor.getAttribute("href");
          const currentLocation = window.location.pathname;

          if (
            href === currentLocation ||
            (href === "index.html" && currentLocation === "/")
          ) {
            link.classList.add(
              "border-t",
              "border-b",
              "border-[#4837ff]",
              "border-b-[#f77062]",
              "rounded-full",
            );
          }

          if (
            window.location.hash === href ||
            (href === "index.html" && window.location.hash === "")
          ) {
            link.classList.add(
              "border-t",
              "border-b",
              "border-[#4837ff]",
              "border-b-[#f77062]",
              "rounded-full",
            );
          }
        });
      }

      window.addEventListener("hashchange", setActiveLink);

      window.addEventListener("load", setActiveLink);

      /* ================= FLIP CARD ================= */

      function flip() {
        document.getElementById("card").classList.toggle("flipped");
      }

      /* ================= SIGNUP VALIDATION ================= */

      function validateFirstName() {
        const value = document.forms["signUp"]["first_name"].value.trim();

        document.getElementById("firstNameError").textContent =
          value === "" ? "First name is required." : "";
      }

      function validateLastName() {
        const value = document.forms["signUp"]["last_name"].value.trim();

        document.getElementById("lastNameError").textContent =
          value === "" ? "Last name is required." : "";
      }

      function validateUsername() {
        const value = document.forms["signUp"]["username"].value.trim();

        document.getElementById("usernameError").textContent =
          value === "" ? "Username is required." : "";
      }

      function validateEmail() {
        const value = document.forms["signUp"]["email"].value.trim();

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        document.getElementById("emailError").textContent = emailPattern.test(
          value,
        )
          ? ""
          : "Enter a valid email address.";
      }

      function validatePassword() {
        const value = document.forms["signUp"]["password"].value;

        document.getElementById("passwordError").textContent =
          value.length >= 6 ? "" : "Password must be at least 6 characters.";
      }

      function validateForm() {
        validateFirstName();
        validateLastName();
        validateUsername();
        validateEmail();
        validatePassword();

        const errors = document.querySelectorAll("#signUp .error");

        for (const error of errors) {
          if (error.textContent !== "") {
            return false;
          }
        }

        alert("✅ Signup successful!");

        return true;
      }

      /* ================= LOGIN VALIDATION ================= */

      function validateLoginUsername() {
        const value = document.forms["loginForm"]["username"].value.trim();

        document.getElementById("loginUsernameError").textContent =
          value === "" ? "Username is required." : "";
      }

      function validateLoginPassword() {
        const value = document.forms["loginForm"]["password"].value;

        document.getElementById("loginPasswordError").textContent =
          value.length >= 6 ? "" : "Password must be at least 6 characters.";
      }

      function validateLoginForm() {
        validateLoginUsername();
        validateLoginPassword();

        const errors = document.querySelectorAll("#loginForm .error");

        for (const error of errors) {
          if (error.textContent !== "") {
            return false;
          }
        }

        alert("✅ Login successful!");

        return true;
      }
    </script>
